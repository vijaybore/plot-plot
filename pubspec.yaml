name: plot_plot
description: "Plot Plot - A property trading board game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.3
  google_sign_in: ^7.2.0
  go_router: ^14.2.7
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.2
  uuid: ^4.4.0
  equatable: ^2.0.5
  auto_size_text: ^3.0.0
  firebase_database: ^11.3.10
  games_services: ^5.1.0
  audioplayers: ^6.8.1
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/